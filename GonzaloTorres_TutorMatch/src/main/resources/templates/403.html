<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f8f9fa;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="text-center">
        <i class="bi bi-shield-x text-danger" style="font-size: 5rem;"></i>
        <h1 class="display-1 fw-bold text-danger mt-2">403</h1>
        <h4 class="mb-2">Acceso denegado</h4>
        <p class="text-muted mb-4">No tienes permisos para acceder a esta página.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a th:href="@{/}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Inicio
            </a>
            <a th:href="@{/login}" class="btn btn-outline-secondary">
                <i class="bi bi-box-arrow-in-right me-1"></i>Cambiar cuenta
            </a>
        </div>
    </div>

</body>
</html>
