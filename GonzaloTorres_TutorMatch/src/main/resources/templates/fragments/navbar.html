<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark shadow-sm"
     style="background: linear-gradient(135deg, #1e3a5f 0%, #1d4ed8 100%);">

    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>TutorMatch
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/}">
                        <i class="bi bi-speedometer2 me-1"></i>Panel
                    </a>
                </li>

                
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-badge me-1"></i>Tutores
                    </a>
                    <ul class="dropdown-menu shadow border-0 rounded-3">
                        <li>
                            <a class="dropdown-item" th:href="@{/tutor/}">
                                <i class="bi bi-list-ul text-primary me-2"></i>Ver listado
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/tutor/new}">
                                <i class="bi bi-plus-circle text-success me-2"></i>Nuevo tutor
                            </a>
                        </li>
                    </ul>
                </li>

                
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-people me-1"></i>Estudiantes
                    </a>
                    <ul class="dropdown-menu shadow border-0 rounded-3">
                        <li>
                            <a class="dropdown-item" th:href="@{/estudiante/listaEstudiantes}">
                                <i class="bi bi-list-ul text-primary me-2"></i>Ver listado
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/estudiante/add}">
                                <i class="bi bi-plus-circle text-success me-2"></i>Nuevo estudiante
                            </a>
                        </li>
                    </ul>
                </li>

                
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-book me-1"></i>Materias
                    </a>
                    <ul class="dropdown-menu shadow border-0 rounded-3">
                        <li>
                            <a class="dropdown-item" th:href="@{/materia/lista}">
                                <i class="bi bi-list-ul text-primary me-2"></i>Ver listado
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/materia/add}">
                                <i class="bi bi-plus-circle text-success me-2"></i>Nueva materia
                            </a>
                        </li>
                    </ul>
                </li>

                
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-calendar-check me-1"></i>Sesiones
                    </a>
                    <ul class="dropdown-menu shadow border-0 rounded-3">
                        <li>
                            <a class="dropdown-item" th:href="@{/sesion/lista}">
                                <i class="bi bi-list-ul text-primary me-2"></i>Ver listado
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/sesion/add}">
                                <i class="bi bi-plus-circle text-success me-2"></i>Nueva sesión
                            </a>
                        </li>
                    </ul>
                </li>

            </ul>

            
            <div class="d-flex align-items-center gap-3">
                <span class="text-white small d-none d-md-inline">
                    <i class="bi bi-person-circle me-1"></i>Admin
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-light btn-sm text-primary fw-semibold">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </button>
                </form>
            </div>

        </div>
    </div>
</nav>

</body>
</html>
