
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Materia – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="mb-4 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container">

    <div class="container mt-4">

        <div class="row g-4">

            
            <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center p-4">

                    <img th:src="${materia.imagen != null ? materia.imagen : 'https://via.placeholder.com/120'}"
                         class="rounded mx-auto mb-3"
                         width="120" height="120"
                         style="object-fit: cover;"
                         alt="Imagen materia">

                    <h4 class="fw-bold mb-2" th:text="${materia.nombre}">Nombre</h4>

                    <span class="badge mb-2"
                          th:classappend="${materia.dificultad.name() == 'ALTO'} ? 'bg-danger' :
                                          (${materia.dificultad.name() == 'MEDIO'} ? 'bg-warning text-dark' : 'bg-success')"
                          th:text="${materia.dificultad}">—</span>

                    <span class="badge bg-secondary mb-3" th:text="${materia.etapa}">—</span>

                    <div class="d-grid gap-2 mt-2">
                        <a th:href="@{/materia/editar/{id}(id=${materia.id})}"
                           class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil me-1"></i>Editar
                        </a>
                        <a th:href="@{/materia/borrar/{id}(id=${materia.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('¿Seguro que quieres borrar esta materia?')">
                            <i class="bi bi-trash me-1"></i>Borrar
                        </a>
                    </div>
                </div>
            </div>

            
            <div class="col-md-8">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-book me-2 text-warning"></i>Datos de la materia
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Nombre</p>
                                <p class="fw-semibold mb-0" th:text="${materia.nombre}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Etapa educativa</p>
                                <p class="fw-semibold mb-0" th:text="${materia.etapa}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Dificultad</p>
                                <span class="badge"
                                      th:classappend="${materia.dificultad.name() == 'ALTO'} ? 'bg-danger' :
                                                      (${materia.dificultad.name() == 'MEDIO'} ? 'bg-warning text-dark' : 'bg-success')"
                                      th:text="${materia.dificultad}">—</span>
                            </div>
                            <div class="col-12">
                                <p class="text-muted small mb-1">Descripción</p>
                                <p class="fw-semibold mb-0" th:text="${materia.descripcion}">—</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/materia/lista}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al listado
            </a>
        </div>

    </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    
</body>
</html>
