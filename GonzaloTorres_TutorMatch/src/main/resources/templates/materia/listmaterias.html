
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Materias</h1>
                <p class="text-muted small mb-0">Listado de todas las materias disponibles</p>
            </div>
            <a th:href="@{/materia/add}" class="btn btn-warning">
                <i class="bi bi-plus-circle me-1"></i>Nueva materia
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Dificultad</th>
                            <th>Etapa</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="materia : ${materias}">
                            <td class="align-middle">
                                <img th:src="${materia.imagen != null ? materia.imagen : 'https://via.placeholder.com/40'}"
                                     width="40" height="40" class="rounded"
                                     style="object-fit: cover;" alt="imagen">
                            </td>
                            <td class="align-middle fw-semibold" th:text="${materia.nombre}">Nombre</td>
                            <td class="align-middle text-muted small" th:text="${materia.descripcion}">Descripción</td>
                            <td class="align-middle">
                                <span class="badge"
                                      th:classappend="${materia.dificultad.name() == 'ALTO'} ? 'bg-danger' :
                                                      (${materia.dificultad.name() == 'MEDIO'} ? 'bg-warning text-dark' : 'bg-success')"
                                      th:text="${materia.dificultad}">—</span>
                            </td>
                            <td class="align-middle">
                                <span class="badge bg-secondary" th:text="${materia.etapa}">—</span>
                            </td>
                            <td class="align-middle">
                                <div class="d-flex gap-1">
                                    <a th:href="@{/materia/detalle/{id}(id=${materia.id})}"
                                       class="btn btn-outline-secondary btn-sm">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/materia/editar/{id}(id=${materia.id})}"
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/materia/borrar/{id}(id=${materia.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('¿Seguro que quieres borrar esta materia?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(materias)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-book fs-3 d-block mb-2"></i>
                                No hay materias registradas todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/admin/}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al panel
            </a>
        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    
</body>
</html>
