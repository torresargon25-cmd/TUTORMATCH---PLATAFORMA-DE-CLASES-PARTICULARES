
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materia – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1">
    <div class="container mt-4">

        <div class="mb-4">
            <h1 class="h3 fw-bold mb-0"
                th:text="${materia.id == null} ? 'Nueva materia' : 'Editar materia'">Materia</h1>
            <p class="text-muted small mb-0"
               th:text="${materia.id == null} ? 'Rellena los datos para crear una nueva materia' : 'Modifica los datos de la materia'"></p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form th:action="${materia.id == null} ? @{/materia/save} : @{/materia/guardar/{id}(id=${materia.id})}"
                      th:object="${materia}"
                      method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" class="form-control"
                                   th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                   placeholder="Nombre de la materia">
                            <span class="invalid-feedback" th:errors="*{nombre}">Error</span>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">URL de la imagen</label>
                            <input type="text" class="form-control" th:field="*{imagen}" placeholder="https://...">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Descripción</label>
                            <textarea class="form-control"
                                      th:field="*{descripcion}"
                                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"
                                      rows="3" placeholder="Descripción de la materia"></textarea>
                            <span class="invalid-feedback" th:errors="*{descripcion}">Error</span>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Dificultad</label>
                            <select class="form-select" th:field="*{dificultad}"
                                    th:classappend="${#fields.hasErrors('dificultad')} ? 'is-invalid'">
                                <option value="">-- Selecciona dificultad --</option>
                                <option th:each="d : ${T(com.salesianostriana.dam.gonzalotorres_tutormatch.enums.NivelDificultadM).values()}"
                                        th:value="${d}" th:text="${d}">DIFICULTAD</option>
                            </select>
                            <span class="invalid-feedback" th:errors="*{dificultad}">Error</span>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Etapa educativa</label>
                            <select class="form-select" th:field="*{etapa}"
                                    th:classappend="${#fields.hasErrors('etapa')} ? 'is-invalid'">
                                <option value="">-- Selecciona etapa --</option>
                                <option th:each="e : ${T(com.salesianostriana.dam.gonzalotorres_tutormatch.enums.EtapaEducativa).values()}"
                                        th:value="${e}" th:text="${e}">ETAPA</option>
                            </select>
                            <span class="invalid-feedback" th:errors="*{etapa}">Error</span>
                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-circle me-1"></i>
                            <span th:text="${materia.id == null} ? 'Crear materia' : 'Guardar cambios'">Guardar</span>
                        </button>
                        <a th:href="@{/materia/lista}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>Cancelar
                        </a>
                        <a th:href="@{/admin/}" class="btn btn-outline-dark">
                            <i class="bi bi-speedometer2 me-1"></i>Panel admin
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
