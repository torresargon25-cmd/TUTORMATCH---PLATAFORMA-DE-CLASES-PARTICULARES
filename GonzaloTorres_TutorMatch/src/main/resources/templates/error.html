<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="text-center px-4">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 5rem;"></i>
            <h2 class="fw-bold mt-3" th:text="${errorTitulo}">Error</h2>
            <p class="text-muted mb-4" th:text="${errorMensaje}">Ha ocurrido un error inesperado.</p>
            <div class="d-flex gap-2 justify-content-center">
                <a th:href="@{/home}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i>Volver al inicio
                </a>
                <a onclick="history.back()" class="btn btn-outline-secondary" style="cursor:pointer;">
                    <i class="bi bi-arrow-left me-1"></i>Volver atrás
                </a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
