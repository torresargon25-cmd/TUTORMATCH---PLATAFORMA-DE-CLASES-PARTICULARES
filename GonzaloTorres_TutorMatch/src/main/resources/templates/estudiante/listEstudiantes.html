
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiantes – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="mb-5 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container"> 

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Estudiantes</h1>
                <p class="text-muted small mb-0">Listado de todos los estudiantes registrados</p>
            </div>
            <a th:href="@{/estudiante/add}" class="btn btn-success">
                <i class="bi bi-plus-circle me-1"></i>Nuevo estudiante
            </a>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Nivel</th>
                            <th>Teléfono</th>
                            <th>¿Menor?</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="estudiante : ${estudiantes}">
                            <td class="align-middle fw-semibold"
                                th:text="${estudiante.nombre + ' ' + estudiante.apellidos}">Nombre</td>
                            <td class="align-middle" th:text="${estudiante.email}">Email</td>
                            <td class="align-middle">
                                <span class="badge bg-secondary"
                                      th:text="${estudiante.nivel}">NIVEL</span>
                            </td>
                            <td class="align-middle" th:text="${estudiante.telefono}">Teléfono</td>
                            <td class="align-middle">
                                <span th:if="${estudiante.esMenor}" class="badge bg-warning text-dark">Sí</span>
                                <span th:unless="${estudiante.esMenor}" class="badge bg-light text-dark">No</span>
                            </td>
                            <td class="align-middle">
                                <div class="d-flex gap-1">
                                    <a th:href="@{/estudiante/detalle/{id}(id=${estudiante.id})}"
                                       class="btn btn-outline-secondary btn-sm">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/estudiante/editar/{id}(id=${estudiante.id})}"
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/estudiante/delete/{id}(id=${estudiante.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('¿Seguro que quieres borrar este estudiante?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(estudiantes)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-people fs-3 d-block mb-2"></i>
                                No hay estudiantes registrados todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/admin/}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al panel
            </a>
        </div>

    </main>   

    <div th:replace="~{fragments/footer :: footer}"></div>
    
</body>
</html>
