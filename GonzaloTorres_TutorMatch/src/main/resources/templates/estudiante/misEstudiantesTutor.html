<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Estudiantes – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="mb-4 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container">

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Mis estudiantes</h1>
                <p class="text-muted small mb-0">Estudiantes con los que tienes sesiones de tutoría</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Nivel</th>
                            <th>Teléfono</th>
                            <th>¿Menor?</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="estudiante : ${estudiantes}">
                            <td class="align-middle fw-semibold"
                                th:text="${estudiante.nombre + ' ' + estudiante.apellidos}">Nombre</td>
                            <td class="align-middle" th:text="${estudiante.email}">Email</td>
                            <td class="align-middle">
                                <span class="badge bg-secondary"
                                      th:text="${estudiante.nivel}">NIVEL</span>
                            </td>
                            <td class="align-middle" th:text="${estudiante.telefono}">Teléfono</td>
                            <td class="align-middle">
                                <span th:if="${estudiante.esMenor}" class="badge bg-warning text-dark">Sí</span>
                                <span th:unless="${estudiante.esMenor}" class="badge bg-light text-dark">No</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(estudiantes)}">
                            <td colspan="5" class="text-center text-muted py-4">
                                <i class="bi bi-people fs-3 d-block mb-2"></i>
                                No tienes estudiantes asignados todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/home}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
            </a>
        </div>

    </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
