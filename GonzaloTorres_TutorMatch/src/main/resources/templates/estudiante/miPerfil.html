<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="mb-4 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container">
    <div class="container mt-4">

        <div class="mb-4">
            <h2 class="fw-bold mb-1"><i class="bi bi-person-circle text-primary me-2"></i>Mi perfil</h2>
            <p class="text-muted small mb-0">Tu información personal en TutorMatch</p>
        </div>

        <div class="row g-4">

            
            <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center p-4">
                    <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                         style="width:100px;height:100px;">
                        <i class="bi bi-person-fill text-success" style="font-size:3rem;"></i>
                    </div>
                    <h4 class="fw-bold mb-0" th:text="${estudiante.nombre + ' ' + estudiante.apellidos}">Nombre</h4>
                    <span class="badge bg-secondary mt-2 mb-2" th:text="${estudiante.nivel}">NIVEL</span>
                    <span th:if="${estudiante.esMenor}" class="badge bg-warning text-dark mb-3">Menor de edad</span>
                    <p class="text-muted small mb-0" th:text="${estudiante.email}">email</p>
                </div>
            </div>

            
            <div class="col-md-8">

                
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-person me-2 text-success"></i>Datos personales
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Nombre</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.nombre}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Apellidos</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.apellidos}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Username</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.username}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Email</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.email}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Teléfono</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.telefono}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Nivel</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.nivel}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">¿Menor de edad?</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.esMenor ? 'Sí' : 'No'}">—</p>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="card border-0 shadow-sm mb-4" th:if="${estudiante.esMenor}">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-person-check me-2 text-warning"></i>Datos del tutor legal
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">Nombre</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.nombreTutorLeg}">—</p>
                            </div>
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">Apellidos</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.apellidosTutorLeg}">—</p>
                            </div>
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">DNI</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.dniTutorLeg}">—</p>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-lightning me-2 text-primary"></i>Accesos rápidos
                    </div>
                    <div class="card-body d-flex gap-2">
                        <a th:href="@{/sesion/mis-sesiones}" class="btn btn-success btn-sm">
                            <i class="bi bi-calendar-check me-1"></i>Mis clases
                        </a>
                        <a th:href="@{/tutor/buscar}" class="btn btn-primary btn-sm">
                            <i class="bi bi-search me-1"></i>Buscar tutor
                        </a>
                        <a th:href="@{/home}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-house me-1"></i>Inicio
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
