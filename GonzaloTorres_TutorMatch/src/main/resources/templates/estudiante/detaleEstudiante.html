<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Estudiante – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="mb-4 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container">

    <div class="container mt-4">

        <div class="row g-4">

            
            <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center p-4">

                    <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                         style="width:100px;height:100px;">
                        <i class="bi bi-person-fill text-success" style="font-size:3rem;"></i>
                    </div>

                    <h4 class="fw-bold mb-0" th:text="${estudiante.nombre + ' ' + estudiante.apellidos}">Nombre</h4>
                    <span class="badge bg-secondary mt-2 mb-2" th:text="${estudiante.nivel}">NIVEL</span>
                    <span th:if="${estudiante.esMenor}" class="badge bg-warning text-dark mb-3">Menor de edad</span>

                    <div class="d-grid gap-2 mt-2">
                        <a th:href="@{/estudiante/editar/{id}(id=${estudiante.id})}"
                           class="btn btn-success btn-sm">
                            <i class="bi bi-pencil me-1"></i>Editar
                        </a>
                        <a th:href="@{/estudiante/delete/{id}(id=${estudiante.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('¿Seguro que quieres borrar este estudiante?')">
                            <i class="bi bi-trash me-1"></i>Borrar
                        </a>
                    </div>
                </div>
            </div>

            
            <div class="col-md-8">

                
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-person me-2 text-success"></i>Datos personales
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Nombre</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.nombre}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Apellidos</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.apellidos}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Email</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.email}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Teléfono</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.telefono}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">Nivel</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.nivel}">—</p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small mb-1">¿Menor de edad?</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.esMenor ? 'Sí' : 'No'}">—</p>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="card border-0 shadow-sm mb-4" th:if="${estudiante.esMenor}">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-person-check me-2 text-warning"></i>Datos del tutor legal
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">Nombre</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.nombreTutorLeg}">—</p>
                            </div>
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">Apellidos</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.apellidosTutorLeg}">—</p>
                            </div>
                            <div class="col-md-4">
                                <p class="text-muted small mb-1">DNI</p>
                                <p class="fw-semibold mb-0" th:text="${estudiante.dniTutorLeg}">—</p>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-calendar-check me-2 text-success"></i>Sesiones de tutoría
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Tutor</th>
                                    <th>Materia</th>
                                    <th>Inicio</th>
                                    <th>Estado</th>
                                    <th>Coste</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="sesion : ${estudiante.listaSesiones}">
                                    <td th:text="${sesion.tutor.nombre + ' ' + sesion.tutor.apellidos}">—</td>
                                    <td th:text="${sesion.materia.nombre}">—</td>
                                    <td th:text="${#temporals.format(sesion.fechaInicio, 'dd/MM/yyyy HH:mm')}">—</td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${sesion.estado.name() == 'PROGRAMADA'} ? 'bg-primary' :
                                                              (${sesion.estado.name() == 'FINALIZADA'} ? 'bg-success' : 'bg-danger')"
                                              th:text="${sesion.estado}">—</span>
                                    </td>
                                    <td th:text="${sesion.costeTotal != null ? sesion.costeTotal + ' €' : '—'}">—</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(estudiante.listaSesiones)}">
                                    <td colspan="5" class="text-center text-muted py-3">
                                        <i class="bi bi-calendar-x me-1"></i>Sin sesiones todavía.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/estudiante/listaEstudiantes}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al listado
            </a>
        </div>

    </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    
</body>
</html>
