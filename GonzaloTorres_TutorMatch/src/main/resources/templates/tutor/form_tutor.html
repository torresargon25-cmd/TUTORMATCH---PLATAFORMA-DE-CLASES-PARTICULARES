
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">

        <div class="mb-4">
            <h1 class="h3 fw-bold mb-0"
                th:text="${tutor.id == null} ? 'Nuevo tutor' : 'Editar tutor'">Tutor</h1>
            <p class="text-muted small mb-0"
               th:text="${tutor.id == null} ? 'Rellena los datos para crear un nuevo tutor' : 'Modifica los datos del tutor'"></p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form th:action="${tutor.id == null} ? @{/tutor/save} : @{/tutor/editar/{id}(id=${tutor.id})}"
                      th:object="${tutor}"
                      method="post">

                    
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" class="form-control"
                                   th:field="*{nombre}"
                                   placeholder="Nombre del tutor">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Apellidos</label>
                            <input type="text" class="form-control"
                                   th:field="*{apellidos}"
                                   placeholder="Apellidos del tutor">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control"
                                   th:field="*{email}"
                                   placeholder="email@ejemplo.com">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control"
                                   th:field="*{password}"
                                   placeholder="Contraseña">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">DNI</label>
                            <input type="text" class="form-control"
                                   th:field="*{dni}"
                                   placeholder="12345678A">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Especialidad</label>
                            <input type="text" class="form-control"
                                   th:field="*{especialidad}"
                                   placeholder="Ej: Matemáticas de Bachillerato">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Tarifa por hora (€)</label>
                            <input type="number" step="0.01" class="form-control"
                                   th:field="*{tarifaHora}"
                                   placeholder="0.00">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Rol</label>
                            <select class="form-select" th:field="*{rol}">
                                <option value="">-- Selecciona un rol --</option>
                                <option th:each="r : ${T(com.salesianostriana.dam.gonzalotorres_tutormatch.enums.Rol).values()}"
                                        th:value="${r}"
                                        th:text="${r}">ROL</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">URL de la imagen</label>
                            <input type="text" class="form-control"
                                   th:field="*{imagen}"
                                   placeholder="https://...">
                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>
                            <span th:text="${tutor.id == null} ? 'Crear tutor' : 'Guardar cambios'">Guardar</span>
                        </button>
                        <a th:href="@{/tutor/}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>


</body>
</html>
