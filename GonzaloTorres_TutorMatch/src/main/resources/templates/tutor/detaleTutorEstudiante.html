
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar sesión – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        .stat-box { border: 1px solid #e9ecef; border-radius: .75rem; padding: .75rem; text-align: center; background: #fff; }
        .horarios-box { background-color: #fff3cd; border-radius: .75rem; padding: 1rem; border: 1px solid #ffc107; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
    <div class="container">

        <div class="card border-0 shadow-sm mb-4">
            <div class="bg-primary text-white p-4 rounded-top">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center"
                         style="width:70px;height:70px;min-width:70px;">
                        <i class="bi bi-person-fill fs-2 text-white"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-1" th:text="${tutor.nombre + ' ' + tutor.apellidos}">Tutor</h3>
                        <span class="opacity-75" th:text="${tutor.especialidad}">Especialidad</span>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-6 col-md-3">
                        <div class="stat-box">
                            <small class="text-muted d-block">Tarifa/hora</small>
                            <span class="fw-bold text-success fs-5" th:text="${tutor.tarifaHora + ' €'}"></span>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-box">
                            <small class="text-muted d-block">Valoración</small>
                            <span class="fw-bold fs-5">
                                <i class="bi bi-star-fill text-warning"></i>
                                <span th:text="${tutor.puntuacionNivel}"></span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-calendar-x text-danger me-2"></i>Horarios ocupados
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(sesionesOcupadas)}" class="text-success small">
                            <i class="bi bi-check-circle me-1"></i>Disponible en todo el horario.
                        </div>
                        <ul class="list-unstyled mb-0" th:unless="${#lists.isEmpty(sesionesOcupadas)}">
                            <li class="small mb-2 text-danger" th:each="s : ${sesionesOcupadas}">
                                <i class="bi bi-clock me-1"></i>
                                <span th:text="${#temporals.format(s.fechaInicio, 'dd/MM/yyyy HH:mm')}"></span>
                                →
                                <span th:text="${#temporals.format(s.fechaFin, 'HH:mm')}"></span>
                            </li>
                        </ul>
                        <div class="alert alert-warning small mt-3 mb-0 p-2">
                            <i class="bi bi-exclamation-triangle me-1"></i>
                            No puedes reservar en horarios ya ocupados.
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom fw-bold py-3">
                        <i class="bi bi-calendar-plus text-primary me-2"></i>Reservar sesión
                    </div>
                    <div class="card-body">
                        <form th:action="@{/sesion/reservar}" method="post">

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="tutorId" th:value="${tutor.id}">

                            <div class="row g-3">

                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Materia</label>
                                    <select class="form-select" name="materiaId" required>
                                        <option value="">-- Selecciona una materia --</option>
                                        <option th:each="materia : ${materias}"
                                                th:value="${materia.id}"
                                                th:text="${materia.nombre + ' (' + materia.etapa + ' - ' + materia.dificultad + ')'}">
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Fecha y hora de inicio</label>
                                    <input type="datetime-local" class="form-control" name="fechaInicio" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Fecha y hora de fin</label>
                                    <input type="datetime-local" class="form-control" name="fechaFin" required>
                                </div>

                                <div class="col-12">
                                    <div class="alert alert-info small mb-0 p-2">
                                        <i class="bi bi-info-circle me-1"></i>
                                        El coste se calculará automáticamente: <strong th:text="${tutor.tarifaHora + ' €/hora'}"></strong>
                                    </div>
                                </div>

                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle me-1"></i>Confirmar reserva
                                </button>
                                <a th:href="@{/tutor/buscar}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Volver
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

        </div>

    </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
