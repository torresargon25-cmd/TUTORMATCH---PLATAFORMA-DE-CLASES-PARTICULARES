<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutores – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="mb-4 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container">

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Tutores</h1>
                <p class="text-muted small mb-0">Listado de todos los tutores registrados</p>
            </div>
            <a th:href="@{/tutor/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i>Nuevo tutor
            </a>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorBorrar}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorBorrar}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Especialidad</th>
                            <th>Email</th>
                            <th>Tarifa/h</th>
                            <th>Puntuación</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tutor : ${tutores}">
                            <td>
                                <img th:src="${tutor.imagen != null ? tutor.imagen : '/img/default-avatar.png'}"
                                     class="rounded-circle" width="40" height="40"
                                     style="object-fit: cover;" alt="Foto tutor">
                            </td>
                            <td class="align-middle fw-semibold"
                                th:text="${tutor.nombre + ' ' + tutor.apellidos}">Nombre</td>
                            <td class="align-middle" th:text="${tutor.especialidad}">Especialidad</td>
                            <td class="align-middle" th:text="${tutor.email}">Email</td>
                            <td class="align-middle" th:text="${tutor.tarifaHora + ' €/h'}">0 €/h</td>
                            <td class="align-middle">
                                <span th:text="${tutor.puntuacionNivel}">0</span>
                                <i class="bi bi-star-fill text-warning small"></i>
                            </td>
                            <td class="align-middle">
                                <span class="badge"
                                      th:classappend="${tutor.rol.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                      th:text="${tutor.rol}">ROL</span>
                            </td>
                            <td class="align-middle">
                                <div class="d-flex gap-1">
                                    <a th:href="@{/tutor/detalle/{id}(id=${tutor.id})}"
                                       class="btn btn-outline-secondary btn-sm">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/tutor/editar/{id}(id=${tutor.id})}"
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/tutor/borrar/{id}(id=${tutor.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('¿Seguro que quieres borrar este tutor?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(tutores)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                <i class="bi bi-person-x fs-3 d-block mb-2"></i>
                                No hay tutores registrados todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/admin/}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al panel
            </a>
        </div>

    </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
