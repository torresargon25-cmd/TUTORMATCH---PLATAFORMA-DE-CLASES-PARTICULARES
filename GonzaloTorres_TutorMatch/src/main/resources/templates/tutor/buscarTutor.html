
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Tutor – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        .page-header { margin-bottom: 2rem; }
        .search-card { border-radius: 1rem; }
        .tutor-card { border-radius: 1rem; transition: all 0.25s ease; overflow: hidden; }
        .tutor-card:hover { transform: translateY(-4px); }
        .avatar-circle { width: 70px; height: 70px; min-width: 70px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.25); }
        .stat-box { border: 1px solid #e9ecef; border-radius: .75rem; padding: .75rem; text-align: center; background: #fff; }
        .horarios-box { background-color: #f8f9fa; border-radius: .75rem; padding: 1rem; }
        .btn-reserva { border-radius: .75rem; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow-1 py-4">
    <div class="container">

        <div class="page-header">
            <h1 class="fw-bold"><i class="bi bi-search text-primary me-2"></i>Buscar tutor</h1>
            <p class="text-muted mb-0">Encuentra el profesor ideal para tus necesidades académicas.</p>
        </div>

        <div class="card border-0 shadow-sm search-card mb-5">
            <div class="card-body p-4">
                <form th:action="@{/tutor/buscar}" method="get">
                    <div class="row g-2 align-items-center">
                        <div class="col-lg">
                            <input type="text" name="especialidad" class="form-control form-control-lg"
                                   placeholder="Ej: Matemáticas, Inglés, Programación..."
                                   th:value="${especialidad}">
                        </div>
                        <div class="col-lg-auto">
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-search me-1"></i>Buscar
                            </button>
                        </div>
                        <div class="col-lg-auto">
                            <a th:href="@{/tutor/buscar}" class="btn btn-outline-secondary btn-lg w-100">Limpiar</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div th:if="${especialidad != null}" class="mb-4">
            <div class="alert alert-light border">
                Mostrando resultados para: <strong th:text="${especialidad}"></strong>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(tutores)}" class="alert alert-info shadow-sm">
            <i class="bi bi-info-circle me-2"></i>No se encontraron tutores con esa especialidad.
        </div>

        <div class="row g-4" th:unless="${#lists.isEmpty(tutores)}">
            <div class="col-lg-6" th:each="tutor : ${tutores}">
                <div class="card border-0 shadow-sm tutor-card h-100">

                    <div class="bg-primary text-white p-4">
                        <div class="d-flex align-items-center gap-3">
                            <div class="avatar-circle">
                                <i class="bi bi-person-fill fs-2"></i>
                            </div>
                            <div>
                                <h4 class="fw-bold mb-1" th:text="${tutor.nombre + ' ' + tutor.apellidos}">Nombre Tutor</h4>
                                <span class="opacity-75" th:text="${tutor.especialidad}">Especialidad</span>
                            </div>
                        </div>
                    </div>

                    <div class="card-body d-flex flex-column">
                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <div class="stat-box">
                                    <small class="text-muted d-block">Tarifa</small>
                                    <span class="fw-bold text-success fs-5" th:text="${tutor.tarifaHora + ' €/h'}"></span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="stat-box">
                                    <small class="text-muted d-block">Valoración</small>
                                    <span class="fw-bold fs-5">
                                        <i class="bi bi-star-fill text-warning"></i>
                                        <span th:text="${tutor.puntuacionNivel}"></span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="horarios-box mb-4">
                            <h6 class="fw-bold mb-3">
                                <i class="bi bi-calendar-x text-danger me-2"></i>Horarios ocupados
                            </h6>
                            <div th:if="${#lists.isEmpty(sesionesPorTutor[tutor.id])}" class="text-success small">
                                <i class="bi bi-check-circle me-1"></i>Disponible en todo el horario.
                            </div>
                            <ul class="list-unstyled mb-0" th:unless="${#lists.isEmpty(sesionesPorTutor[tutor.id])}">
                                <li class="small mb-2" th:each="s : ${sesionesPorTutor[tutor.id]}">
                                    <i class="bi bi-clock text-danger me-1"></i>
                                    <span th:text="${#temporals.format(s.fechaInicio, 'dd/MM/yyyy HH:mm')}"></span>
                                    -
                                    <span th:text="${#temporals.format(s.fechaFin, 'HH:mm')}"></span>
                                </li>
                            </ul>
                        </div>

                        <div class="mt-auto">
                            <a th:href="@{/tutor/reservar/{id}(id=${tutor.id})}"
                               class="btn btn-primary w-100 btn-reserva">
                                <i class="bi bi-calendar-plus me-2"></i>Ver detalle y reservar
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="mt-5">
            <a th:href="@{/home}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Volver al inicio
            </a>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
