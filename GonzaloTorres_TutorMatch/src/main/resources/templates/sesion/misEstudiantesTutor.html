<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Estudiantes – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1">
    <div class="container mt-4">

        <div class="mb-4">
            <h2 class="fw-bold mb-1"><i class="bi bi-people text-success me-2"></i>Mis estudiantes</h2>
            <p class="text-muted small mb-0">Estudiantes con los que tienes sesiones</p>
        </div>

        <div th:if="${#lists.isEmpty(estudiantes)}" class="alert alert-info">
            <i class="bi bi-info-circle me-1"></i>No tienes estudiantes asignados todavía.
        </div>

        <div class="row g-4" th:unless="${#lists.isEmpty(estudiantes)}">
            <div class="col-md-4" th:each="estudiante : ${estudiantes}">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body text-center">
                        <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                             style="width:70px;height:70px;">
                            <i class="bi bi-person-fill text-success" style="font-size:2rem;"></i>
                        </div>
                        <h5 class="fw-bold mb-1" th:text="${estudiante.nombre + ' ' + estudiante.apellidos}">Nombre</h5>
                        <span class="badge bg-secondary mb-2" th:text="${estudiante.nivel}">NIVEL</span>
                        <p class="text-muted small mb-1" th:text="${estudiante.email}">email</p>
                        <p class="text-muted small mb-0" th:text="${estudiante.telefono}">teléfono</p>
                        <span th:if="${estudiante.esMenor}" class="badge bg-warning text-dark mt-2">Menor de edad</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/home}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
            </a>
        </div>

    </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
