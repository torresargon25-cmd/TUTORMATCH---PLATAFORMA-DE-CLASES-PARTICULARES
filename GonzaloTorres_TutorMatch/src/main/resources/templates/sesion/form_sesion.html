<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Sesión – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="mb-4 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container">
    <div class="container mt-4">

        <div class="mb-4">
            <h1 class="h3 fw-bold mb-0">Nueva sesión de tutoría</h1>
            <p class="text-muted small mb-0">Rellena los datos para crear una nueva sesión</p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form th:action="@{/sesion/save}" method="post">

                    
                    <div th:if="${errorFecha}" class="alert alert-danger mb-3" th:text="${errorFecha}"></div>

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tutor</label>
                            <select class="form-select" name="tutorId" required>
                                <option value="">-- Selecciona tutor --</option>
                                <option th:each="tutor : ${tutores}"
                                        th:value="${tutor.id}"
                                        th:text="${tutor.nombre + ' ' + tutor.apellidos + ' (' + tutor.especialidad + ')'}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estudiante</label>
                            <select class="form-select" name="estudianteId" required>
                                <option value="">-- Selecciona estudiante --</option>
                                <option th:each="estudiante : ${estudiantes}"
                                        th:value="${estudiante.id}"
                                        th:text="${estudiante.nombre + ' ' + estudiante.apellidos}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Materia</label>
                            <select class="form-select" name="materiaId" required>
                                <option value="">-- Selecciona materia --</option>
                                <option th:each="materia : ${materias}"
                                        th:value="${materia.id}"
                                        th:text="${materia.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estado</label>
                            <select class="form-select" name="estado" required>
                                <option value="">-- Selecciona estado --</option>
                                <option th:each="e : ${estados}"
                                        th:value="${e}"
                                        th:text="${e}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Fecha y hora de inicio</label>
                            <input type="datetime-local" class="form-control" name="fechaInicio" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Fecha y hora de fin</label>
                            <input type="datetime-local" class="form-control" name="fechaFin" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Observaciones</label>
                            <textarea class="form-control" name="observaciones" rows="3"
                                      placeholder="Observaciones opcionales..."></textarea>
                        </div>

                        <div class="col-12">
                            <div class="alert alert-info small mb-0">
                                <i class="bi bi-info-circle me-1"></i>
                                El coste total se calculará automáticamente según la tarifa del tutor y la duración de la sesión.
                            </div>
                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-info">
                            <i class="bi bi-check-circle me-1"></i>Crear sesión
                        </button>
                        <a th:href="@{/sesion/lista}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>Cancelar
                        </a>
                        <a th:href="@{/admin/}" class="btn btn-outline-dark">
                            <i class="bi bi-speedometer2 me-1"></i>Panel admin
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
