<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesiones entre fechas – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1">
    <div class="container mt-4">

        <div class="mb-4">
            <h2 class="fw-bold mb-1"><i class="bi bi-calendar-range text-primary me-2"></i>Sesiones entre fechas</h2>
            <p class="text-muted small mb-0">Consulta todas las sesiones dentro de un rango de fechas</p>
        </div>

        <!-- Formulario de búsqueda -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/sesion/entre-fechas}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label fw-semibold">Fecha desde</label>
                        <input type="datetime-local" class="form-control" name="fechaDesde"
                               th:value="${fechaDesde != null ? #temporals.format(fechaDesde, 'yyyy-MM-dd') + 'T' + #temporals.format(fechaDesde, 'HH:mm') : ''}">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-semibold">Fecha hasta</label>
                        <input type="datetime-local" class="form-control" name="fechaHasta"
                               th:value="${fechaHasta != null ? #temporals.format(fechaHasta, 'yyyy-MM-dd') + 'T' + #temporals.format(fechaHasta, 'HH:mm') : ''}">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search me-1"></i>Buscar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Resultados -->
        <div th:if="${sesiones != null}">

            <div th:if="${#lists.isEmpty(sesiones)}" class="alert alert-info">
                <i class="bi bi-info-circle me-1"></i>No hay sesiones en ese rango de fechas.
            </div>

            <div th:unless="${#lists.isEmpty(sesiones)}" class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom fw-bold py-3">
                    <i class="bi bi-list-ul me-2 text-primary"></i>
                    Resultados — <span th:text="${#lists.size(sesiones)}">0</span> sesiones encontradas
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Tutor</th>
                                <th>Estudiante</th>
                                <th>Materia</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                                <th class="text-center">Estado</th>
                                <th class="text-center">Coste</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sesion : ${sesiones}">
                                <td th:text="${sesion.tutor.nombre + ' ' + sesion.tutor.apellidos}">—</td>
                                <td th:text="${sesion.estudiante.nombre + ' ' + sesion.estudiante.apellidos}">—</td>
                                <td th:text="${sesion.materia.nombre}">—</td>
                                <td th:text="${#temporals.format(sesion.fechaInicio, 'dd/MM/yyyy HH:mm')}">—</td>
                                <td th:text="${#temporals.format(sesion.fechaFin, 'HH:mm')}">—</td>
                                <td class="text-center">
                                    <span class="badge"
                                          th:classappend="${sesion.estado.name() == 'PROGRAMADA'} ? 'bg-primary' :
                                                         (${sesion.estado.name() == 'FINALIZADA'} ? 'bg-success' : 'bg-danger')"
                                          th:text="${sesion.estado}">—</span>
                                </td>
                                <td class="text-center fw-bold text-success"
                                    th:text="${sesion.costeTotal != null ? sesion.costeTotal + ' €' : 'Pendiente'}">—</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/home}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
            </a>
        </div>

    </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
