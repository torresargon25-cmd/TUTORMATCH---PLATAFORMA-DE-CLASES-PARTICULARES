<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Clases – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="mb-4 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container">
    <div class="container mt-4">

        <div class="mb-4">
            <h2 class="fw-bold mb-1"><i class="bi bi-calendar-check text-success me-2"></i>Mis clases</h2>
            <p class="text-muted small mb-0">Aquí puedes ver todas tus sesiones de tutoría</p>
        </div>

        <div class="d-flex gap-2 mb-4">
            <a th:href="@{/sesion/mis-sesiones}" class="btn btn-outline-secondary btn-sm">Todas</a>
            <a th:href="@{/sesion/mis-sesiones?estado=PROGRAMADA}" class="btn btn-outline-primary btn-sm">Programadas</a>
            <a th:href="@{/sesion/mis-sesiones?estado=FINALIZADA}" class="btn btn-outline-success btn-sm">Finalizadas</a>
            <a th:href="@{/sesion/mis-sesiones?estado=CANCELADA}" class="btn btn-outline-danger btn-sm">Canceladas</a>
        </div>

        <div class="card border-0 shadow-sm mb-4 bg-success bg-opacity-10">
            <div class="card-body d-flex align-items-center gap-3">
                <i class="bi bi-cash-coin text-success" style="font-size:2rem;"></i>
                <div>
                    <p class="text-muted small mb-0">Coste total acumulado</p>
                    <h4 class="fw-bold mb-0 text-success">
                        <span th:text="${#aggregates.sum(sesiones.![costeTotal != null ? costeTotal : 0])} + ' €'">0.00 €</span>
                    </h4>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(sesiones)}" class="alert alert-info">
            <i class="bi bi-info-circle me-1"></i>No tienes sesiones registradas todavía.
            <a th:href="@{/tutor/buscar}" class="alert-link ms-1">¡Busca un tutor!</a>
        </div>

        <div class="row g-4" th:unless="${#lists.isEmpty(sesiones)}">
            <div class="col-md-6" th:each="sesion : ${sesiones}">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
                        <span class="fw-bold" th:text="${sesion.materia.nombre}">Materia</span>
                        <span class="badge"
                              th:classappend="${sesion.estado.name() == 'PROGRAMADA'} ? 'bg-primary' :
                                             (${sesion.estado.name() == 'FINALIZADA'} ? 'bg-success' : 'bg-danger')"
                              th:text="${sesion.estado}">Estado</span>
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <i class="bi bi-person-badge text-primary"></i>
                            <span th:text="${sesion.tutor.nombre + ' ' + sesion.tutor.apellidos}">Tutor</span>
                        </div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <i class="bi bi-calendar text-muted"></i>
                            <span th:text="${#temporals.format(sesion.fechaInicio, 'dd/MM/yyyy HH:mm')}">Inicio</span>
                            <span class="text-muted">→</span>
                            <span th:text="${#temporals.format(sesion.fechaFin, 'HH:mm')}">Fin</span>
                        </div>
                        <div class="d-flex align-items-center gap-2 mb-2" th:if="${sesion.observaciones != null}">
                            <i class="bi bi-chat-text text-muted"></i>
                            <span class="text-muted small" th:text="${sesion.observaciones}">Observaciones</span>
                        </div>
                        <div class="d-flex align-items-center gap-2 mt-3">
                            <i class="bi bi-cash-coin text-success"></i>
                            <strong class="text-success"
                                    th:text="${sesion.costeTotal != null ? sesion.costeTotal + ' €' : 'Pendiente'}">Coste</strong>
                        </div>
                        <div class="mt-3">
                            <a th:href="@{/sesion/borrar/{id}(id=${sesion.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Estás seguro de que quieres cancelar esta sesión?')">
                                <i class="bi bi-trash me-1"></i>Cancelar sesión
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/home}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
            </a>
        </div>

    </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
