
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesiones – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Sesiones de tutoría</h1>
                <p class="text-muted small mb-0">Listado de todas las sesiones registradas</p>
            </div>
            <a th:href="@{/sesion/add}" class="btn btn-info">
                <i class="bi bi-plus-circle me-1"></i>Nueva sesión
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Tutor</th>
                            <th>Estudiante</th>
                            <th>Materia</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                            <th>Coste</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sesion : ${sesiones}">
                            <td class="align-middle" th:text="${sesion.tutor.nombre + ' ' + sesion.tutor.apellidos}">—</td>
                            <td class="align-middle" th:text="${sesion.estudiante.nombre + ' ' + sesion.estudiante.apellidos}">—</td>
                            <td class="align-middle" th:text="${sesion.materia.nombre}">—</td>
                            <td class="align-middle small" th:text="${#temporals.format(sesion.fechaInicio, 'dd/MM/yyyy HH:mm')}">—</td>
                            <td class="align-middle small" th:text="${#temporals.format(sesion.fechaFin, 'dd/MM/yyyy HH:mm')}">—</td>
                            <td class="align-middle" th:text="${sesion.costeTotal != null ? sesion.costeTotal + ' €' : '—'}">—</td>
                            <td class="align-middle">
                                <span class="badge"
                                      th:classappend="${sesion.estado.name() == 'PROGRAMADA'} ? 'bg-primary' :
                                                      (${sesion.estado.name() == 'FINALIZADA'} ? 'bg-success' : 'bg-danger')"
                                      th:text="${sesion.estado}">—</span>
                            </td>
                            <td class="align-middle">
                                <div class="d-flex gap-1">
                                    <a th:href="@{/sesion/detalle/{id}(id=${sesion.id})}"
                                       class="btn btn-outline-secondary btn-sm">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/sesion/editar/{id}(id=${sesion.id})}"
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/sesion/borrar/{id}(id=${sesion.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('¿Seguro que quieres borrar esta sesión?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(sesiones)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                <i class="bi bi-calendar-x fs-3 d-block mb-2"></i>
                                No hay sesiones registradas todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/admin/}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al panel
            </a>
        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    
</body>
</html>
