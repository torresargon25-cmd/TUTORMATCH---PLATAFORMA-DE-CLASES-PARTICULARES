
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Sesión – TutorMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }</style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="mb-4 d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="my-5 container">

    <div class="container mt-4">

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white border-bottom fw-bold py-3 d-flex justify-content-between align-items-center">
                <span><i class="bi bi-calendar-check me-2 text-info"></i>Detalle de la sesión</span>
                <span class="badge"
                      th:classappend="${sesion.estado.name() == 'PROGRAMADA'} ? 'bg-primary' :
                                      (${sesion.estado.name() == 'FINALIZADA'} ? 'bg-success' : 'bg-danger')"
                      th:text="${sesion.estado}">—</span>
            </div>
            <div class="card-body">
                <div class="row g-4">

                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Tutor</p>
                        <p class="fw-semibold mb-0" th:text="${sesion.tutor.nombre + ' ' + sesion.tutor.apellidos}">—</p>
                        <p class="text-muted small mb-0" th:text="${sesion.tutor.especialidad}">—</p>
                    </div>

                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Estudiante</p>
                        <p class="fw-semibold mb-0" th:text="${sesion.estudiante.nombre + ' ' + sesion.estudiante.apellidos}">—</p>
                        <p class="text-muted small mb-0" th:text="${sesion.estudiante.nivel}">—</p>
                    </div>

                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Materia</p>
                        <p class="fw-semibold mb-0" th:text="${sesion.materia.nombre}">—</p>
                        <p class="text-muted small mb-0" th:text="${sesion.materia.etapa}">—</p>
                    </div>

                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Fecha inicio</p>
                        <p class="fw-semibold mb-0" th:text="${#temporals.format(sesion.fechaInicio, 'dd/MM/yyyy HH:mm')}">—</p>
                    </div>

                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Fecha fin</p>
                        <p class="fw-semibold mb-0" th:text="${#temporals.format(sesion.fechaFin, 'dd/MM/yyyy HH:mm')}">—</p>
                    </div>

                    <div class="col-md-4">
                        <p class="text-muted small mb-1">Coste total</p>
                        <p class="fw-semibold mb-0" th:text="${sesion.costeTotal != null ? sesion.costeTotal + ' €' : 'No calculado'}">—</p>
                    </div>

                    <div class="col-12" th:if="${sesion.observaciones != null and !sesion.observaciones.isEmpty()}">
                        <p class="text-muted small mb-1">Observaciones</p>
                        <p class="fw-semibold mb-0" th:text="${sesion.observaciones}">—</p>
                    </div>

                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/sesion/editar/{id}(id=${sesion.id})}" class="btn btn-primary btn-sm">
                <i class="bi bi-pencil me-1"></i>Editar
            </a>
            <a th:href="@{/sesion/borrar/{id}(id=${sesion.id})}"
               class="btn btn-outline-danger btn-sm"
               onclick="return confirm('¿Seguro que quieres borrar esta sesión?')">
                <i class="bi bi-trash me-1"></i>Borrar
            </a>
            <a th:href="@{/sesion/lista}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al listado
            </a>
        </div>

    </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
   
</body>
</html>
